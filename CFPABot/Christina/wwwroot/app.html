<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFPA Bot</title>

    <!-- Global config (API base URL) -->
    <script src="scripts/config.js"></script>

    <!-- Auth guard - redirect to login if not authenticated -->
    <script>
        (function () {
            function checkCookie(name) {
                return document.cookie.split(';').some(cookie => cookie.trim().startsWith(name + '='));
            }

            // If no auth cookie, redirect to login immediately
            if (!checkCookie('oauth-token-enc')) {
                window.location.href = 'login.html';
                return;
            }

            // Store auth state globally for Alpine to access later
            window.__AUTH_STATE__ = {
                isCheckingAuth: true,
                isLoggedIn: false,
                isAdmin: false,
                githubUser: { login: '', avatar_url: '' }
            };

            fetch(window.API_BASE_URL + '/UserStatus', {
                credentials: 'include'
            })
                .then(res => {
                    if (res.ok) {
                        return res.json();
                    }
                    throw new Error('Not authenticated');
                })
                .then(data => {
                    if (data.isError === true) {
                        throw new Error('API returned error');
                    }
                    window.__AUTH_STATE__.isLoggedIn = true;
                    window.__AUTH_STATE__.githubUser = {
                        login: data.userName || 'User',
                        avatar_url: data.avatarUrl || ''
                    };
                    window.__AUTH_STATE__.isAdmin = data.isAdmin === true;
                    window.__AUTH_STATE__.isCheckingAuth = false;
                })
                .catch(err => {
                    console.log('Not authenticated:', err);
                    // Remove invalid cookie and redirect to login
                    document.cookie = 'oauth-token-enc=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    window.location.href = 'login.html';
                });
        })();
    </script>

    <!-- Libraries CDN -->
    <script defer src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/htmx.org@latest/dist/htmx.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@latest/dist/cdn.min.js"></script>
    <!-- Icons -->
    <script defer src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Tailwind config - wait for Tailwind to load since it's deferred
        (function configureTailwind() {
            if (typeof tailwind !== 'undefined') {
                tailwind.config = {
                    darkMode: 'class',
                    theme: {
                        extend: {
                            colors: {
                                slate: {
                                    850: '#1e293b', // Custom darker slate
                                    950: '#020617',
                                }
                            },
                            fontFamily: {
                                sans: ['Inter', 'sans-serif'],
                            }
                        },
                    },
                };
            } else {
                // Retry after a short delay
                setTimeout(configureTailwind, 50);
            }
        })();
    </script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        /* Smooth icon rendering - reduce flicker on tool switching */
        #tool-content svg {
            transition: opacity 0.15s ease-in-out;
        }

        /* Lucide icons fade in smoothly */
        #tool-content [data-lucide] {
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        #tool-content [data-lucide].lucide {
            opacity: 1;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8);
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        /* Animation Keyframes for Toast Progress */
        @keyframes shrink {
            from {
                width: 100%;
            }

            to {
                width: 0%;
            }
        }

        /* Title CSS moved to external stylesheet */
    </style>
    <link rel="stylesheet" href="styles/preloader.css" />
    <link rel="stylesheet" href="styles/title.css" />
</head>

<body
    class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden selection:bg-indigo-500/30 selection:text-indigo-200"
    x-data="appData()" x-init="initializeApp()" @remove-toast="removeToast($event.detail.id)">

    <script>
        // Ensure Lucide is initialized when Alpine is ready
        function initializeApp() {
            var attempts = 0;
            var maxAttempts = 200; // ~10 seconds at 50ms intervals

            function tryInitLucide() {
                if (typeof lucide !== 'undefined' && lucide.createIcons) {
                    lucide.createIcons();
                } else {
                    attempts++;
                    if (attempts < maxAttempts) {
                        // Lucide not ready yet, retry with exponential backoff
                        setTimeout(tryInitLucide, 50);
                    }
                }
            }
            tryInitLucide();

            // Also try again after window fully loads
            window.addEventListener('load', function () {
                if (typeof lucide !== 'undefined' && lucide.createIcons) {
                    lucide.createIcons();
                }
            });
        }
    </script>
    <!-- Inline Preloader (covers page until all resources load) -->
    <div id="preloader">
        <div class="preloader__spinner"></div>
        <div class="preloader__text">Loading…</div>
    </div>

    <!-- Global Toast Container -->
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-3 w-80 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <!-- Individual Toast Item -->
            <div x-data="toastItem(toast)" x-init="initTimer()" @mouseenter="pauseTimer()" @mouseleave="resumeTimer()"
                class="pointer-events-auto relative flex items-start p-4 rounded-lg border shadow-lg backdrop-blur-sm transition-all duration-300 transform group"
                :class="{
                    'bg-emerald-900/90 border-emerald-500/50 text-emerald-100': toast.type === 'SUCCESS',
                    'bg-red-900/90 border-red-500/50 text-red-100': toast.type === 'ERROR',
                    'bg-amber-900/90 border-amber-500/50 text-amber-100': toast.type === 'WARNING',
                    'bg-blue-900/90 border-blue-500/50 text-blue-100': toast.type === 'INFO',
                    'scale-[1.02]': isPaused
                }" x-show="show" x-transition:enter="translate-x-full opacity-0"
                x-transition:enter-end="translate-x-0 opacity-100" x-transition:leave="transition ease-in duration-300"
                x-transition:leave-start="translate-x-0 opacity-100"
                x-transition:leave-end="translate-x-full opacity-0">
                <!-- Icon based on type -->
                <div class="flex-shrink-0 mt-0.5 mr-3">
                    <template x-if="toast.type === 'SUCCESS'"><i data-lucide="check-circle"
                            class="w-5 h-5 text-emerald-400"></i></template>
                    <template x-if="toast.type === 'ERROR'"><i data-lucide="alert-circle"
                            class="w-5 h-5 text-red-400"></i></template>
                    <template x-if="toast.type === 'WARNING'"><i data-lucide="alert-triangle"
                            class="w-5 h-5 text-amber-400"></i></template>
                    <template x-if="toast.type === 'INFO'"><i data-lucide="info"
                            class="w-5 h-5 text-blue-400"></i></template>
                </div>

                <div class="flex-1">
                    <p class="text-sm font-medium" x-text="toast.message"></p>
                    <div x-show="isPaused"
                        class="text-[10px] mt-1 opacity-75 uppercase tracking-wider font-bold animate-pulse">Paused
                    </div>
                </div>

                <!-- Close Button -->
                <button @click="close()" class="ml-4 flex-shrink-0 text-white/50 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>

                <!-- Progress Bar (Visual Indicator) -->
                <div class="absolute bottom-0 left-0 h-1 bg-white/20 transition-all duration-100 linear"
                    :style="`width: ${progress}%`"></div>
            </div>
        </template>
    </div>

    <!-- Global Modal Overlay -->
    <div x-show="modal.isOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4"
        x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">

        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="closeModal()"></div>

        <!-- Modal Content -->
        <div class="relative bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-95 translate-y-4"
            x-transition:enter-end="opacity-100 scale-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 scale-100 translate-y-0"
            x-transition:leave-end="opacity-0 scale-95 translate-y-4">

            <div class="flex items-center justify-between p-6 border-b border-slate-800 bg-slate-900/50">
                <h3 class="text-xl font-semibold text-slate-100" x-text="modal.title"></h3>
                <button @click="closeModal()"
                    class="p-1 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto custom-scrollbar text-slate-300" x-html="modal.content"></div>

            <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex justify-end gap-3">
                <button @click="closeModal()"
                    class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white transition-colors">Close</button>
                <button @click="closeModal()"
                    class="px-4 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-md shadow-lg shadow-indigo-500/20 transition-all">Acknowledge</button>
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="flex flex-col h-screen">

        <!-- Header -->
        <header
            class="h-16 flex-shrink-0 bg-slate-900 border-b border-slate-800 flex items-center px-6 justify-between z-20 shadow-sm">
            <div class="flex items-center gap-3 title-hover">
                <div
                    class="logo-hover w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i data-lucide="terminal" class="w-5 h-5 text-white"></i>
                </div>
                <h1 class="text-xl font-bold app-title">
                    <span class="app-title-group">
                        <span
                            class="app-title-base bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">C</span>
                        <span class="app-title-extended text-indigo-300/90">hristina's</span>
                    </span>
                    <span class="app-title-group">
                        <span
                            class="app-title-base bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">F</span>
                        <span class="app-title-extended text-indigo-300/90">unctional</span>
                    </span>
                    <span class="app-title-group">
                        <span
                            class="app-title-base bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">P</span>
                        <span class="app-title-extended text-indigo-300/90">rocessing</span>
                    </span>
                    <span class="app-title-group app-title-group--last">
                        <span
                            class="app-title-base bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">A</span>
                        <span class="app-title-extended text-indigo-300/90">utomation</span>
                    </span>
                    <span
                        class="app-title-base bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Bot</span>
                </h1>
            </div>

            <template x-if="isLoggedIn">
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-3">
                        <template x-if="isAdmin">
                            <div
                                class="px-2 py-1 bg-amber-500/20 border border-amber-500/50 rounded text-xs font-semibold text-amber-400 flex items-center gap-1">
                                <i data-lucide="shield-check" class="w-3 h-3"></i>
                                Admin
                            </div>
                        </template>
                        <div class="text-right">
                            <p class="text-xs font-semibold text-slate-200" x-text="githubUser.login"></p>
                            <p class="text-xs text-slate-500">GitHub</p>
                        </div>
                        <button @click="logout()"
                            class="h-8 w-8 rounded-full bg-indigo-600 border border-indigo-500 flex items-center justify-center hover:bg-indigo-500 transition-all cursor-pointer"
                            :style="`background-image: url(${githubUser.avatar_url}); background-size: cover; background-position: center;`"
                            title="Click to logout">
                        </button>
                    </div>
                </div>
            </template>
        </header>

        <!-- Body -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col flex-shrink-0 transition-all">
                <div class="p-4 border-b border-slate-800/50">
                    <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider pl-2">
                        Tools & Sections
                    </h2>
                </div>
                <nav class="flex-1 overflow-y-auto p-3 space-y-2">
                    <template x-for="section in sections" :key="section.id">
                        <div>
                            <!-- Section Header / Direct Tool -->
                            <button
                                @click="'toolId' in section ? navigateToRoute(section.id, section.toolId) : navigateToRoute(section.id, getTools(section.id)[0]?.id || 'Overview')"
                                class="w-full flex items-center gap-3 transition-all duration-200 rounded-lg" :class="
                                    'toolId' in section && section.toolId !== null
                                        ? (activeTool === section.toolId 
                                            ? 'px-3 py-2 text-sm font-normal bg-emerald-500/10 text-emerald-300 border border-emerald-500/30' 
                                            : 'px-3 py-2 text-sm font-normal text-emerald-400 hover:bg-emerald-500/5 hover:text-emerald-300 border border-transparent')
                                        : (activeSection === section.id 
                                            ? 'px-3 py-2 text-sm font-semibold bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' 
                                            : 'px-3 py-2 text-sm font-semibold text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 border border-transparent')
                                ">
                                <i :data-lucide="section.icon" class="w-4 h-4 flex-shrink-0"></i>
                                <span x-text="section.label" class="flex-1 text-left"></span>
                                <!-- Arrow for expandable sections only -->
                                <i x-show="!('toolId' in section) || section.toolId === null"
                                    :data-lucide="activeSection === section.id ? 'chevron-down' : 'chevron-right'"
                                    class="w-4 h-4 opacity-60 flex-shrink-0"></i>
                            </button>
                            <!-- Tools in this section (only show if not direct tool) -->
                            <template x-if="activeSection === section.id && !('toolId' in section)">
                                <div class="mt-1 space-y-1 pl-4">
                                    <template x-for="tool in getTools(section.id)" :key="tool.id">
                                        <button @click="navigateToRoute(section.id, tool.id)"
                                            class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-all duration-200 group"
                                            :class="activeTool === tool.id ? 'bg-slate-800 text-indigo-400 border border-slate-700' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 border border-transparent'">
                                            <div class="flex items-center gap-3">
                                                <i :data-lucide="tool.icon" class="w-4 h-4 transition-colors"
                                                    :class="activeTool === tool.id ? 'text-indigo-400' : 'text-slate-500 group-hover:text-slate-300'"></i>
                                                <span x-text="tool.label"></span>
                                            </div>
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </nav>
                <div class="p-4 border-t border-slate-800 text-xs text-slate-600 text-center">
                    v3.0.0 &bull; Alpine/HTMX
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto bg-slate-950 p-8 relative custom-scrollbar">
                <div class="max-w-5xl mx-auto" id="tool-content">
                    <!-- Tool content will be loaded here via router system -->
                    <div class="flex items-center justify-center h-[60vh] text-slate-500">
                        <div class="animate-pulse">Loading tool...</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Remove preloader when authentication check completes and interface is rendered -->
    <!-- Preloader Management Script -->
    <script>
        (function () {
            // ========================================
            // Variables
            // ========================================
            var app = null;
            var lucideReady = false;
            var preloaderRemoveRequested = false;

            // ========================================
            // Helper Functions
            // ========================================

            function hasCookie(name) {
                return document.cookie.split(';').some(function (cookie) {
                    return cookie.trim().startsWith(name + '=');
                });
            }

            function removePreloader() {
                var el = document.getElementById('preloader');
                if (!el) return;

                var isLoggedIn = app && app.$data && app.$data.isLoggedIn;

                el.style.opacity = '0';
                setTimeout(function () {
                    if (el && el.parentNode) el.parentNode.removeChild(el);
                }, 300);
            }

            function checkAndRemovePreloader() {
                if (!window.__AUTH_STATE__ || window.__AUTH_STATE__.isCheckingAuth !== false) return;
                if (!app || !app.$data || app.$data.isCheckingAuth !== false) return;

                if (!preloaderRemoveRequested) {
                    preloaderRemoveRequested = true;
                    removePreloader();
                }
            }

            var alpineFound = false;
            var observer = null;

            function setupAlpine(bodyEl) {
                if (alpineFound) return;

                if (bodyEl.__x) {
                    app = bodyEl.__x;
                } else if (window.Alpine && window.Alpine.$data) {
                    try {
                        app = { $data: window.Alpine.$data(bodyEl) };
                    } catch (e) {
                        return;
                    }
                }

                alpineFound = true;
                checkAndRemovePreloader();
                observer = setInterval(checkAndRemovePreloader, 100);
                setTimeout(function () {
                    if (observer) clearInterval(observer);
                    removePreloader();
                }, 8000);
            }

            var checkInterval = setInterval(function () {
                var bodyEl = document.querySelector('[x-data]');
                if (bodyEl && (bodyEl.__x || window.Alpine)) {
                    clearInterval(checkInterval);
                    setupAlpine(bodyEl);
                }
            }, 50);

            document.addEventListener('alpine:initialized', function () {
                clearInterval(checkInterval);
                var bodyEl = document.querySelector('[x-data]');
                if (bodyEl) setupAlpine(bodyEl);
            });

            window.addEventListener('load', function () {
                if (typeof lucide !== 'undefined') lucide.createIcons();
                setTimeout(removePreloader, 500);
            });

            window.checkAndRemovePreloader = checkAndRemovePreloader;
        })();
    </script>

    <!-- Application Logic -->
    <script src="scripts/app.js"></script>
</body>

</html>
