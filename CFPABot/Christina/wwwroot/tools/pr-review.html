<div x-data="prReviewData()" x-init="init()" class="p-4 space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
      <i data-lucide="git-pull-request" class="w-6 h-6"></i>
      PR Multi-Model Review
    </h1>
  </div>

  <!-- Settings & Models -->
  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="space-y-1">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Target PR Number</label>
        <input type="number" x-model="prNumber" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 shadow-sm focus:ring-slate-500 focus:border-slate-500 sm:text-sm h-10">
      </div>
      <div class="space-y-1 lg:col-span-2">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Mod</label>
        <div class="flex gap-2 items-center">
          <template x-if="mods.length === 0">
            <input type="text" x-model="selectedMod" placeholder="Click Find to load mods" class="flex-1 min-w-0 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 shadow-sm focus:ring-slate-500 focus:border-slate-500 sm:text-sm h-10">
          </template>
          <template x-if="mods.length > 0">
            <select x-model="selectedMod" class="flex-1 min-w-0 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 shadow-sm focus:ring-slate-500 focus:border-slate-500 sm:text-sm h-10 appearance-none">
              <template x-for="m in mods" :key="m">
                <option :value="m" x-text="m"></option>
              </template>
            </select>
          </template>
          <button @click="loadMods()" :disabled="!prNumber || modsLoading" class="flex-shrink-0 px-3 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 disabled:opacity-50 flex items-center justify-center gap-1 text-sm whitespace-nowrap h-10">
            <i x-show="!modsLoading" data-lucide="search" class="w-4 h-4"></i>
            <i x-show="modsLoading" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
            <span x-text="modsLoading ? '...' : 'Find'"></span>
          </button>
        </div>
      </div>
      <div class="space-y-1">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Importance Level</label>
        <select x-model="importanceLevel" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 shadow-sm focus:ring-slate-500 focus:border-slate-500 sm:text-sm h-10 appearance-none">
          <option value="low">Low</option>
          <option value="medium">Medium (default)</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>

    <!-- Models -->
    <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
      <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200 mb-3">Model Selection</h3>
      <div class="flex flex-wrap gap-3">
        <template x-for="model in models" :key="model.provider + ':' + model.modelId">
          <label class="inline-flex items-center space-x-2 bg-slate-50 dark:bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800">
            <input type="checkbox" x-model="model.enabled" class="rounded text-slate-600 focus:ring-slate-500 border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700">
            <span class="text-sm text-slate-700 dark:text-slate-300" x-text="model.displayName || model.modelId"></span>
          </label>
        </template>
      </div>
    </div>

    <!-- Consistency -->
    <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
      <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200 mb-3">Consistency Check Settings</h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <label class="flex items-center space-x-2 px-3 py-2 h-10">
          <input type="checkbox" x-model="consistencyEnabled" class="rounded text-slate-600 focus:ring-slate-500 border-slate-300 dark:border-slate-600">
          <span class="text-sm text-slate-700 dark:text-slate-300">Enable Consistency Check</span>
        </label>
        <select x-model="consistencyScope" :disabled="!consistencyEnabled" class="px-3 py-2 h-10 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 shadow-sm focus:ring-slate-500 focus:border-slate-500 sm:text-sm disabled:opacity-50 appearance-none">
          <option value="diff_only">Diff Only</option>
          <option value="full_mod">Full Mod</option>
        </select>
        <select x-model="consistencyModel" :disabled="!consistencyEnabled" class="px-3 py-2 h-10 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 shadow-sm focus:ring-slate-500 focus:border-slate-500 sm:text-sm disabled:opacity-50 appearance-none">
          <option value="">-- Select Model --</option>
          <template x-for="model in models" :key="model.provider + ':' + model.modelId">
            <option :value="model.provider + ':' + model.modelId" x-text="model.displayName || model.modelId"></option>
          </template>
        </select>
      </div>
    </div>

    <div class="flex justify-end space-x-3 pt-4 border-t border-slate-200 dark:border-slate-700">
      <button @click="loadReview(false)" :disabled="loading || !selectedMod" class="px-4 py-2 h-10 bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900 rounded-lg hover:bg-slate-700 dark:hover:bg-slate-300 focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 disabled:opacity-50 flex items-center justify-center space-x-2">
        <i x-show="!loading || loadingForce" data-lucide="play" class="w-4 h-4"></i>
        <i x-show="loading && !loadingForce" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        <span>Review</span>
      </button>
      <button x-show="loading" @click="cancelReview()" class="px-4 py-2 h-10 bg-red-600 text-white rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-offset-2 focus:ring-red-500 flex items-center justify-center space-x-2">
        <i data-lucide="x" class="w-4 h-4"></i>
        <span>Cancel</span>
      </button>
      <button @click="loadReview(true)" :disabled="loading || !selectedMod" class="px-4 py-2 h-10 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 disabled:opacity-50 flex items-center justify-center space-x-2">
        <i x-show="!loading || !loadingForce" data-lucide="refresh-cw" class="w-4 h-4"></i>
        <i x-show="loading && loadingForce" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        <span>Force Refresh</span>
      </button>
      <button @click="historyVisible = !historyVisible" :disabled="!selectedMod" class="relative px-4 py-2 h-10 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-600 focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 disabled:opacity-50 flex items-center justify-center space-x-2">
        <i x-show="!historyLoading" data-lucide="history" class="w-4 h-4"></i>
        <i x-show="historyLoading" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        <span>History</span>
        <span x-show="history.length > 0" class="absolute -top-1.5 -right-1.5 inline-flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-slate-500 rounded-full" x-text="history.length"></span>
      </button>
    </div>
  </div>

  <!-- History Panel -->
  <div x-show="historyVisible && history.length > 0" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
    <div class="px-6 py-3 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
      <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200 flex items-center gap-2">
        <i data-lucide="history" class="w-4 h-4"></i>
        Cached Review History
      </h3>
      <button @click="historyVisible = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="divide-y divide-slate-200 dark:divide-slate-700">
      <template x-for="entry in history" :key="entry.hash">
        <button @click="loadHistoryCacheEntry(entry.hash)" class="w-full text-left px-6 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors flex items-center gap-4">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-sm font-medium text-slate-800 dark:text-slate-200" x-text="new Date(entry.cachedAt).toLocaleString()"></span>
              <span x-show="entry.isStale" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-xs font-medium bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300">
                <i data-lucide="alert-triangle" class="w-3 h-3"></i>
                Source changed
              </span>
            </div>
            <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">
              <span x-text="entry.models.join(', ') || '(no model info)'"></span>
              <span class="mx-1">·</span>
              <span x-text="entry.importance"></span>
              <template x-if="entry.consistency">
                <span class="ml-1 inline-flex items-center px-1 py-0.5 rounded text-xs bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300">consistency</span>
              </template>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 flex-shrink-0"></i>
        </button>
      </template>
    </div>
  </div>

  <!-- Progress Dashboard -->
  <div x-show="loading || perModelProgress.length > 0" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 space-y-4">
    <h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200">Review Progress</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <template x-for="prog in perModelProgress" :key="prog.key || prog.modelId">
        <div class="space-y-1">
          <div class="flex justify-between text-sm">
            <span class="font-medium text-slate-700 dark:text-slate-300" x-text="prog.label || prog.modelId"></span>
            <span class="text-slate-500 dark:text-slate-400" x-text="prog.statusText || ((prog.completed || 0) + ' / ' + (prog.total || 0))"></span>
          </div>
          <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2">
            <div class="h-2 rounded-full transition-all duration-300"
                 :class="prog.indeterminate ? 'bg-sky-500 animate-pulse' : (prog.stage === 'consistency' ? 'bg-sky-600' : 'bg-indigo-600')"
                 :style="prog.indeterminate ? 'width: 35%' : ('width: ' + ((prog.total ? prog.completed / prog.total : 0) * 100) + '%')"></div>
          </div>
        </div>
      </template>
    </div>
    <div x-show="statusMessage" class="text-sm text-slate-600 dark:text-slate-400 italic" x-text="statusMessage"></div>
  </div>

  <!-- Results -->
  <div x-show="result && !loading" class="space-y-6">
    <!-- Consistency Report -->
    <div x-show="consistencyEnabled && result?.consistencyReport?.error" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-700/50 rounded-xl p-6">
      <h3 class="text-lg font-semibold text-red-800 dark:text-red-300 mb-2 flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-5 h-5"></i>
        Consistency Check Failed
      </h3>
      <p class="text-sm text-red-700 dark:text-red-300" x-text="result?.consistencyReport?.error"></p>
    </div>
    <div x-show="consistencyEnabled && !result?.consistencyReport?.error && result?.consistencyReport?.inconsistencies?.length > 0" class="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700/50 rounded-xl p-6">
      <h3 class="text-lg font-semibold text-amber-800 dark:text-amber-300 mb-2 flex items-center gap-2">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        Consistency Report
        <span x-show="result?.consistencyReport?.wasTruncated" class="text-xs font-normal text-amber-600 dark:text-amber-400">(已截断)</span>
      </h3>
      <div class="space-y-2 text-sm text-amber-900 dark:text-amber-200">
        <template x-for="inc in result?.consistencyReport?.inconsistencies || []" :key="inc.enTerm">
          <div class="flex flex-wrap items-baseline gap-2">
            <span class="font-semibold" x-text="inc.enTerm"></span>
            <template x-for="v in inc.variants" :key="v.translation">
              <span class="bg-amber-100 dark:bg-amber-800/40 px-1.5 py-0.5 rounded text-xs">
                <span x-text="v.translation"></span>
                <span class="opacity-60 ml-1" x-text="(v.entryIds || []).length ? '(' + (v.entryIds || []).slice(0,3).map(id => '#' + id).join(', ') + ')' : ''"></span>
              </span>
            </template>
          </div>
        </template>
      </div>
    </div>

    <!-- Global Notes -->
    <div x-show="result?.modelResults?.some(mr => mr.globalNotes)" class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-700/50 rounded-xl p-6 space-y-4">
      <h3 class="text-lg font-semibold text-blue-800 dark:text-blue-300 flex items-center gap-2">
        <i data-lucide="info" class="w-5 h-5"></i>
        Global Notes
      </h3>
      <div class="space-y-3">
        <template x-for="mr in result?.modelResults || []" :key="mr.spec.uniqueId">
          <div x-show="mr.globalNotes">
            <p class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider mb-1" x-text="mr.spec.uniqueId"></p>
            <div class="prose dark:prose-invert max-w-none text-sm text-blue-900 dark:text-blue-200" x-html="mr.globalNotes"></div>
          </div>
        </template>
      </div>
    </div>

    <!-- Review Items Table -->
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
          <thead class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
            <tr>
              <th class="px-6 py-3 font-semibold text-slate-800 dark:text-slate-200">Key / Path</th>
              <th class="px-6 py-3 font-semibold text-slate-800 dark:text-slate-200">Original</th>
              <th class="px-6 py-3 font-semibold text-slate-800 dark:text-slate-200">Translation</th>
              <th class="px-6 py-3 font-semibold text-slate-800 dark:text-slate-200 text-center">Status</th>
              <th class="px-6 py-3 font-semibold text-slate-800 dark:text-slate-200"></th>
            </tr>
          </thead>
          <template x-for="(item, index) in result?.frontendDisplayItems" :key="item.id ?? index">
            <tbody x-data="{ expanded: false, rowId: item.id ?? index }">
              <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors cursor-pointer border-t border-slate-200 dark:border-slate-700" @click="expanded = !expanded">
                <td class="px-6 py-4">
                  <div class="font-medium text-slate-900 dark:text-slate-100 max-w-[200px] truncate" x-text="item.key" :title="item.key"></div>
                </td>
                <td class="px-6 py-4">
                  <div class="max-w-[250px] truncate text-slate-600 dark:text-slate-300" x-text="item.source" :title="item.source"></div>
                </td>
                <td class="px-6 py-4">
                  <div class="max-w-[250px] truncate text-slate-600 dark:text-slate-300" x-text="item.target" :title="item.target"></div>
                </td>
                <td class="px-6 py-4 text-center">
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                        :class="getAggregatedStatusClass(rowId)" x-text="getAggregatedStatusText(rowId)"></span>
                </td>
                <td class="px-6 py-4 text-right">
                  <button type="button" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="chevron-down" class="w-5 h-5 transition-transform" :class="{'rotate-180': expanded}"></i>
                  </button>
                </td>
              </tr>
              <!-- Expanded detail row — spans full width, no absolute positioning -->
              <tr x-show="expanded" class="bg-slate-50/50 dark:bg-slate-900/50" @click.stop>
                <td colspan="5" class="px-6 py-4">
                  <div class="space-y-4">
                    <template x-for="mr in result?.modelResults || []" :key="mr.spec.uniqueId">
                      <div x-data="{ mrItem: mr.items.find(x => x.id === rowId) }" class="bg-white dark:bg-slate-800 rounded-lg p-4 border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div class="flex items-start justify-between mb-2">
                          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200" x-text="mr.spec.uniqueId"></span>
                          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold" :class="getStatusClass(getStatusSeverity(mrItem?.status || 'NotReviewed'))" x-text="getStatusText(getStatusSeverity(mrItem?.status || 'NotReviewed'))"></span>
                        </div>
                        <div x-show="!mrItem" class="text-sm text-slate-500 dark:text-slate-400">
                          This entry does not have a review result for this model.
                        </div>
                        <template x-for="(issue, ii) in mrItem?.issues || []" :key="ii">
                          <div class="pl-3 border-l-2 mb-2" :class="{ 'border-red-400': issue.severity === 'NeedsFix', 'border-amber-400': issue.severity === 'Minor', 'border-violet-400': issue.severity === 'NeedsContext' }">
                            <div class="flex items-center gap-2 mb-1">
                              <span class="text-xs font-bold" :class="{ 'text-red-500': issue.severity === 'NeedsFix', 'text-amber-500': issue.severity === 'Minor', 'text-violet-500': issue.severity === 'NeedsContext' }" x-text="issue.severity"></span>
                              <span class="text-xs text-slate-500 dark:text-slate-400" x-text="issue.type"></span>
                            </div>
                            <div class="text-sm text-slate-700 dark:text-slate-300" x-html="issue.message"></div>
                            <div x-show="issue.reason" class="text-xs text-slate-500 dark:text-slate-400 mt-1" x-html="issue.reason"></div>
                            <div x-show="issue.suggestion" class="mt-1 bg-emerald-50 dark:bg-emerald-900/20 rounded p-2 text-sm" x-html="issue.suggestion"></div>
                          </div>
                        </template>
                        <div x-show="mrItem && mrItem.suggestedTarget" class="mt-3">
                          <p class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Suggested Translation:</p>
                          <pre class="bg-slate-100 dark:bg-slate-900 p-2 rounded text-xs text-slate-800 dark:text-slate-200 overflow-x-auto whitespace-pre-wrap" x-text="mrItem.suggestedTarget"></pre>
                        </div>
                      </div>
                    </template>
                  </div>
                </td>
              </tr>
            </tbody>
          </template>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="scripts/tools/pr-review.js"></script>
