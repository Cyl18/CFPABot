<div x-data="prReviewData()" x-init="init()" class="h-full flex flex-col space-y-4">
    <!-- Header Controls -->
    <div class="bg-slate-800 rounded-lg p-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-4">
            <h2 class="text-xl font-bold flex items-center gap-2">
                <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                PR Review
            </h2>
            <div class="flex items-center gap-2">
                <input type="number" x-model="prNumber" @keyup.enter="loadMods()" placeholder="PR #"
                    class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 w-24 focus:outline-none focus:border-blue-500" />
                <button @click="loadMods()" :disabled="loading"
                    class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white px-3 py-1.5 rounded transition">
                    <span x-show="!loading">Load PR</span>
                    <span x-show="loading" class="flex items-center gap-2">
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Loading...
                    </span>
                </button>
            </div>
            
            <div x-show="mods.length > 0" class="flex items-center gap-2">
                <select x-model="selectedMod" class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 focus:outline-none focus:border-blue-500 max-w-xs truncate">
                    <template x-for="mod in mods" :key="mod">
                        <option :value="mod" x-text="mod" :selected="mod === selectedMod"></option>
                    </template>
                </select>                <select x-model="importanceLevel" class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 focus:outline-none focus:border-blue-500">
                    <option value="low">低重要度 (Low)</option>
                    <option value="medium">中重要度 (Medium)</option>
                    <option value="high">高重要度 (High)</option>
                </select>                    <div class="flex items-center gap-1">
                        <button @click="loadReview(false)" :disabled="reviewLoading || !selectedMod"
                            class="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white px-3 py-1.5 rounded-l border-r border-emerald-800 transition">
                            <span x-show="!reviewLoading">Review</span>
                            <span x-show="reviewLoading" class="flex items-center gap-2">
                                <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                                <span x-show="reviewProgress.total === 0">...</span>
                                <span x-show="reviewProgress.total > 0 && !reviewProgress.merging" x-text="reviewProgress.completed + '/' + reviewProgress.total"></span>
                                <span x-show="reviewProgress.merging">Merging...</span>
                            </span>
                        </button>
                        <button @click="loadReview(true)" :disabled="reviewLoading || !selectedMod" title="Force Re-Review (Clear Cache)"
                            class="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white px-3 py-1.5 rounded-r transition">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        </button>
                    </div>
            </div>
        </div>

        <!-- View Controls (Hidden in dropdown-like or simple toggle buttons) -->
        <div class="flex items-center gap-3 text-sm">
            <label class="flex items-center gap-2 cursor-pointer text-slate-300 hover:text-white transition">
                <input type="checkbox" x-model="filterPROnly" class="rounded bg-slate-900 border-slate-700 flex-shrink-0" />
                Only Changed
            </label>
            <label class="flex items-center gap-2 cursor-pointer text-slate-300 hover:text-white transition">
                <input type="checkbox" x-model="hidePassed" class="rounded bg-slate-900 border-slate-700 flex-shrink-0" />
                Hide Passed
            </label>
            
            <!-- More View Options (Toggles) -->
            <div class="relative" x-data="{ open: false }" @click.outside="open = false">
                <button @click="open = !open" class="flex items-center gap-2 px-3 py-1.5 bg-slate-900 hover:bg-slate-700 rounded border border-slate-700 transition">
                    <i data-lucide="settings-2" class="w-4 h-4"></i> View
                </button>
                <div x-show="open" x-cloak class="absolute right-0 mt-2 w-56 bg-slate-800 border border-slate-700 rounded shadow-xl z-20 py-2">
                    <label class="flex items-center justify-between px-4 py-2 cursor-pointer hover:bg-slate-700">
                        <span class="flex items-center gap-2"><i data-lucide="hash" class="w-4 h-4 text-slate-400"></i> Line Numbers</span>
                        <input type="checkbox" x-model="showLineNumber" class="rounded bg-slate-900 border-slate-700" />
                    </label>
                    <label class="flex items-center justify-between px-4 py-2 cursor-pointer hover:bg-slate-700">
                        <span class="flex items-center gap-2"><i data-lucide="arrow-down-z-a" class="w-4 h-4 text-slate-400"></i> Sort by Severity</span>
                        <input type="checkbox" x-model="sortBySeverity" class="rounded bg-slate-900 border-slate-700" />
                    </label>
                    <div class="my-1 border-t border-slate-700"></div>
                    <label class="flex items-center justify-between px-4 py-2 cursor-pointer hover:bg-slate-700">
                        <span class="flex items-center gap-2"><i data-lucide="key" class="w-4 h-4 text-slate-400"></i> Show Key</span>
                        <input type="checkbox" x-model="showKey" class="rounded bg-slate-900 border-slate-700" />
                    </label>
                    <label class="flex items-center justify-between px-4 py-2 cursor-pointer hover:bg-slate-700">
                        <span class="flex items-center gap-2"><i data-lucide="languages" class="w-4 h-4 text-slate-400"></i> Show Base EN</span>
                        <input type="checkbox" x-model="showBaseEN" class="rounded bg-slate-900 border-slate-700" />
                    </label>
                    <label class="flex items-center justify-between px-4 py-2 cursor-pointer hover:bg-slate-700">
                        <span class="flex items-center gap-2"><i data-lucide="languages" class="w-4 h-4 text-slate-400"></i> Show Base CN</span>
                        <input type="checkbox" x-model="showBaseCN" class="rounded bg-slate-900 border-slate-700" />
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Map -->
    <div x-show="error" x-cloak class="bg-red-900/30 text-red-400 p-4 rounded-lg flex items-center gap-3">
        <i data-lucide="alert-triangle" class="w-5 h-5 flex-shrink-0"></i>
        <span x-text="error"></span>
    </div>

    <!-- Main Content -->
    <div x-show="reviewData" x-cloak class="flex-1 overflow-auto space-y-6">
        
        <!-- Stats summary -->
        <div class="flex items-center gap-4 text-sm text-slate-400 pb-2 border-b border-slate-800">
            <span class="text-white font-medium">Review Complete</span>
            <span>&bull;</span>
            <span x-text="filteredItems.length + ' Items Shown'"></span>
            <span x-show="hidePassed && filteredItems.length < totalFilteredCount" class="italic px-2" x-text="'(' + (totalFilteredCount - filteredItems.length) + ' passed items hidden)'"></span>
        </div>

        <!-- The List -->
        <div class="space-y-3">
            <template x-for="(item, index) in filteredItems" :key="item.id || item.index">
                <!-- Row Item -->
                <div @click="if(item.issues && item.issues.length > 0) toggleExpand(item.index)"
                     class="bg-slate-850 border border-slate-700 rounded hover:border-slate-500 transition-colors flex flex-col relative"
                     :class="{
                         'cursor-pointer': item.issues && item.issues.length > 0,
                         'border-l-4': true,
                         'border-l-slate-700': item.status === 'Pass',
                         'border-l-amber-500': item.status === 'Minor',
                         'border-l-red-500': item.status === 'NeedsFix',
                         'border-l-violet-500': item.status === 'NeedsContext'
                     }">
                     
                    <!-- Optional Line Number -->
                    <div x-show="showLineNumber" class="absolute -left-1 top-4 text-[10px] font-mono text-slate-500 bg-slate-900 border border-slate-700 px-1 py-0.5 rounded shadow-sm z-10 transform -translate-x-full" x-text="'#' + (item.index + 1)"></div>

                    <!-- Main Text Row -->
                    <div class="px-3 py-3 flex gap-4 items-start relative">

                        <div class="flex-1 grid gap-4 lg:grid-cols-2 relative" 
                             :class="{ 'grid-cols-1': !showBaseEN && !showBaseCN }">
                             
                            <!-- Divider (Large Screens) -->
                            <div class="hidden lg:block absolute left-1/2 top-0 bottom-0 w-px bg-slate-700/30 -ml-2"></div>

                            <!-- EN Column (Right Aligned) -->
                            <div class="space-y-1 text-right lg:pr-6">
                                <div x-show="showBaseEN" class="text-xs text-slate-500 italic pb-1 mb-1 border-b border-slate-700/50 inline-block" x-text="item.baseSource || '-'"></div>
                                <div class="text-base text-slate-400" x-text="item.source"></div>
                                <div x-show="showKey" class="text-xs text-slate-500 font-mono mt-1 opacity-50 break-all inline-block bg-slate-900/50 px-1.5 rounded" x-text="item.key"></div>
                            </div>

                            <!-- CN Column (Left Aligned) -->
                            <div class="space-y-1 lg:pl-6 pr-14 lg:pr-12 text-left">
                                <div x-show="showBaseCN" class="text-xs text-slate-500 italic pb-1 mb-1 border-b border-slate-700/50 inline-block" x-text="item.baseTarget || '-'"></div>
                                <div class="text-base text-slate-100" x-text="item.target"></div>
                                
                                <!-- Badges & Actions placed at end of CN column -->
                                <div class="absolute top-1 right-2 flex items-center justify-end">
                                    <button x-show="item.issues && item.issues.length > 0"
                                        @click.stop="toggleExpand(item.index)" 
                                        class="flex items-center gap-1.5 px-2 py-1 rounded text-xs font-semibold transition"
                                        :class="{
                                            'bg-amber-500/10 text-amber-500 hover:bg-amber-500/20': item.status === 'Minor',
                                            'bg-red-500/10 text-red-500 hover:bg-red-500/20': item.status === 'NeedsFix',
                                            'bg-violet-500/10 text-violet-500 hover:bg-violet-500/20': item.status === 'NeedsContext'
                                        }">
                                        <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                                        <span x-text="item.issues.length"></span>
                                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 transform transition-transform" :class="expandedRows.has(item.index) ? 'rotate-180' : ''"></i>
                                    </button>
                                    <span x-show="!item.issues || item.issues.length === 0" class="text-xs text-slate-500 px-2 py-1 flex flex-col items-center justify-center opacity-50">
                                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 mb-0.5"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Issues Expanded Area -->
                    <div x-show="expandedRows.has(item.index)" x-collapse class="bg-slate-900 border-t border-slate-800 p-4 space-y-3">
                        <template x-for="(issue, iIndex) in item.issues" :key="iIndex">
                            <div class="pl-3 border-l-2" 
                                 :class="{
                                    'border-amber-500': issue.severity === 'Minor',
                                    'border-red-500': issue.severity === 'NeedsFix',
                                    'border-violet-500': issue.severity === 'NeedsContext'
                                 }">
                                 
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold px-1.5 py-0.5 rounded leading-none"
                                          :class="{
                                              'bg-amber-500/20 text-amber-500': issue.severity === 'Minor',
                                              'bg-red-500/20 text-red-500': issue.severity === 'NeedsFix',
                                              'bg-violet-500/20 text-violet-500': issue.severity === 'NeedsContext'
                                          }" x-text="issue.severity"></span>
                                    <span class="text-xs font-mono text-slate-400" x-text="issue.type"></span>
                                </div>
                                <div class="text-sm text-slate-200 mt-1" x-text="issue.message"></div>
                                
                                <div x-show="issue.reason" class="mt-2 text-xs text-slate-400 bg-slate-850 p-2 rounded">
                                    <span class="font-semibold opacity-70">Reason:</span> <span x-text="issue.reason"></span>
                                </div>

                                <div x-show="issue.suggestion" class="mt-2 text-sm">
                                    <div class="text-xs font-semibold text-emerald-500 mb-1 flex items-center gap-1">
                                        <i data-lucide="sparkles" class="w-3 h-3"></i> Suggested Target
                                    </div>
                                    <div class="px-3 py-1.5 bg-emerald-900/20 border border-emerald-900/50 rounded text-emerald-100" x-text="issue.suggestion"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
            
            <div x-show="filteredItems.length === 0" class="text-center py-12 text-slate-500">
                <i data-lucide="check-circle" class="w-12 h-12 mx-auto mb-3 opacity-50 text-emerald-500"></i>
                <p>No items to display based on current filters.</p>
            </div>
        </div>

        <!-- Global Notes -->
        <div x-show="reviewData?.globalNotes?.length > 0" class="mt-8 bg-slate-850 border border-slate-700 rounded-lg p-5 border-l-4 border-l-blue-500">
            <h3 class="text-lg font-bold flex items-center gap-2 mb-3">
                <i data-lucide="info" class="w-5 h-5 text-blue-400"></i> Global Review Notes
            </h3>
            <ul class="list-disc pl-5 space-y-2 text-slate-300 text-sm">
                <template x-for="note in (reviewData?.globalNotes || [])">
                    <li x-text="note"></li>
                </template>
            </ul>
        </div>
        
    </div>
</div>

<script>
function prReviewData() {
    return {
        prNumber: '',
        loading: false,
        reviewLoading: false,
        reviewProgress: { completed: 0, total: 0, merging: false },
        error: '',
        
        mods: [],
        selectedMod: '',
        importanceLevel: 'medium',
        
        // Review Results
        reviewData: null,
        expandedRows: new Set(),
        
        // View Filters
        filterPROnly: true,
        hidePassed: true, // "极简": hide passed by default to focus on issues
        showLineNumber: true,
        sortBySeverity: true,
        showKey: false,
        showBaseEN: false,
        showBaseCN: false,

        // Initialize from URL query params
        init() {
            const urlParams = new URLSearchParams(window.location.search);
            const prParam = urlParams.get('pr');
            if (prParam) {
                this.prNumber = prParam;
                this.loadMods();
            }
            
            // Wait for DOM
            this.$nextTick(() => {
                if(typeof lucide !== 'undefined') lucide.createIcons();
            });
        },

        async loadMods() {
            if(!this.prNumber) return;
            this.loading = true;
            this.error = '';
            this.mods = [];
            this.selectedMod = '';
            this.reviewData = null;
            
            try {
                // Remove ?pr= to prevent infinite nesting, but wait we are in Hash router generally.
                // If it's tools/pr-review via hash #/Review/PR-Review, URL params are on main page.
                
                const response = await fetch(`${window.API_BASE_URL}/PRMods?pr=${this.prNumber}`);
                if (!response.ok) {
                    const txt = await response.text();
                    throw new Error(txt || 'Failed to fetch mods');
                }
                const data = await response.json();
                const mods = data && (data.mods || data.Mods) ? (data.mods || data.Mods) : data;
                
                if (mods && mods.length > 0) {
                    this.mods = mods;
                    if(this.mods.length === 1) {
                        this.selectedMod = this.mods[0];
                    }
                } else {
                    this.error = 'No mods found for this PR.';
                }
            } catch (err) {
                this.error = err.message || 'Error occurred while loading mods';
                console.error(err);
            } finally {
                this.loading = false;
                this.$nextTick(() => {
                    if(typeof lucide !== 'undefined') lucide.createIcons();
                });
            }
        },

        async loadReview(force = false) {
            if(!this.prNumber || !this.selectedMod) return;
            this.reviewLoading = true;
            this.reviewProgress = { completed: 0, total: 0, merging: false };
            this.error = '';
            this.reviewData = null;
            this.expandedRows.clear();

            let url = `${window.API_BASE_URL}/PRLLMReviewResult?pr=${this.prNumber}&mod=${encodeURIComponent(this.selectedMod)}&importance=${encodeURIComponent(this.importanceLevel)}`;
            if (force) url += '&force=true';
            const es = new EventSource(url, { withCredentials: true });

            es.onmessage = (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }

                if (msg.type === 'progress') {
                    this.reviewProgress = { completed: msg.completed, total: msg.total, merging: !!msg.merging };
                } else if (msg.type === 'done') {
                    es.close();
                    this.processReviewData(msg.result);
                    this.reviewLoading = false;
                    this.$nextTick(() => {
                        if(typeof lucide !== 'undefined') lucide.createIcons();
                    });
                } else if (msg.type === 'error') {
                    es.close();
                    this.error = msg.message || 'Error occurred while loading review result';
                    this.reviewLoading = false;
                }
            };

            es.onerror = (event) => {
                console.error('SSE error event:', event, 'readyState:', es.readyState);
                es.close();
                if (this.reviewLoading) {
                    this.error = 'Connection error while loading review result';
                    this.reviewLoading = false;
                }
            };
        },

        processReviewData(data) {
            if(!data.frontendDisplayItems || !data.llmOutputItems) {
                this.error = 'Invalid response format API';
                return;
            }
            let combinedItems = [];
            const len = Math.min(data.frontendDisplayItems.length, data.llmOutputItems.length);
            for(let i = 0; i < len; i++) {
                const fd = data.frontendDisplayItems[i];
                const llm = data.llmOutputItems[i];
                combinedItems.push({
                    index: i,
                    key: fd.key,
                    source: fd.source,
                    target: fd.target,
                    baseSource: fd.baseSource,
                    baseTarget: fd.baseTarget,
                    status: llm.status,
                    issues: llm.issues || []
                });
            }
            this.reviewData = {
                items: combinedItems,
                globalNotes: Array.isArray(data.globalNotes) 
                    ? data.globalNotes 
                    : (typeof data.globalNotes === 'string' 
                        ? data.globalNotes.split('\n').filter(n => n.trim()) 
                        : [])
            };
        },

        get totalFilteredCount() {
            if(!this.reviewData || !this.reviewData.items) return 0;
            return this.reviewData.items.filter(item => {
                if (this.filterPROnly) {
                    const changed = (item.baseSource !== item.source) || (item.baseTarget !== item.target);
                    // if both base are null, consider it a new line so changed=true
                    const isNew = item.baseSource == null && item.baseTarget == null;
                    if(!changed && !isNew) {
                        return false;
                    }
                }
                return true;
            }).length;
        },

        get filteredItems() {
            if(!this.reviewData || !this.reviewData.items) return [];
            
            let items = this.reviewData.items.filter(item => {
                // Filter 1: PR Only
                if (this.filterPROnly) {
                    const changed = (item.baseSource !== item.source) || (item.baseTarget !== item.target);
                    const isNew = item.baseSource == null && item.baseTarget == null;
                    if(!changed && !isNew) {
                        return false;
                    }
                }
                
                // Filter 2: Hide Passed (only applies if status === 'Pass' AND no issues)
                if (this.hidePassed) {
                    if (item.status === 'Pass' && (!item.issues || item.issues.length === 0)) {
                        return false;
                    }
                }
                
                return true;
            });
            
            if (this.sortBySeverity) {
                const severityRank = {
                    'NeedsFix': 4,
                    'NeedsContext': 3,
                    'Minor': 2,
                    'Pass': 1
                };
                items = items.sort((a, b) => {
                    const rankA = severityRank[a.status] || 0;
                    const rankB = severityRank[b.status] || 0;
                    if (rankA !== rankB) {
                        return rankB - rankA; // Higher rank first
                    }
                    return a.index - b.index; // Keep original order for same rank
                });
            }
            
            return items;
        },
        
        toggleExpand(index) {
            if(this.expandedRows.has(index)) {
                this.expandedRows.delete(index);
            } else {
                this.expandedRows.add(index);
            }
            // Trigger react
            this.expandedRows = new Set(this.expandedRows);
            this.$nextTick(() => {
                if(typeof lucide !== 'undefined') lucide.createIcons();
            });
        }
    }
}
</script>
