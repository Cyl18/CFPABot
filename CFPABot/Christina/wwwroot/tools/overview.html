<div class="mb-8">
    <h2 class="text-3xl font-bold text-white mb-2">Dashboard Overview</h2>
    <p class="text-slate-400">System status and quick actions.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm flex flex-col">
        <span class="text-sm text-slate-500 font-medium">System Status</span>
        <span class="text-2xl font-bold mt-2 text-emerald-400">Operational</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm flex flex-col">
        <span class="text-sm text-slate-500 font-medium">Uptime</span>
        <span class="text-2xl font-bold mt-2 text-blue-400">14d 2h 12m</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm flex flex-col">
        <span class="text-sm text-slate-500 font-medium">Memory Usage</span>
        <span class="text-2xl font-bold mt-2 text-amber-400">64%</span>
    </div>
</div>

<h3 class="text-lg font-semibold text-white mb-4">Quick Interactions</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Modal Trigger Card -->
    <div
        class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm hover:border-indigo-500/50 transition-colors group cursor-pointer">
        <div class="flex items-center gap-4 mb-4">
            <div
                class="p-3 bg-indigo-500/10 rounded-lg text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition-all">
                <i data-lucide="maximize-2" class="w-6 h-6"></i>
            </div>
            <div>
                <h4 class="font-bold text-white">Critical Alert Modal</h4>
                <p class="text-sm text-slate-400">Triggers the global modal context.</p>
            </div>
        </div>
        <button @click="openCriticalModal()"
            class="w-full px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-lg border border-slate-700 transition-all active:scale-95">
            Trigger Modal
        </button>
    </div>

    <!-- Toast Trigger Card -->
    <div
        class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm hover:border-emerald-500/50 transition-colors group cursor-pointer">
        <div class="flex items-center gap-4 mb-4">
            <div
                class="p-3 bg-emerald-500/10 rounded-lg text-emerald-400 group-hover:bg-emerald-500 group-hover:text-white transition-all">
                <i data-lucide="mouse-pointer-2" class="w-6 h-6"></i>
            </div>
            <div>
                <h4 class="font-bold text-white">Interactive Toast</h4>
                <p class="text-sm text-slate-400">Hover over the toast to pause it.</p>
            </div>
        </div>
        <button @click="addToast('I will disappear in 5 seconds unless you hover over me!', 'SUCCESS', 5000)"
            class="w-full px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-lg border border-slate-700 transition-all active:scale-95">
            Spawn Toast
        </button>
    </div>
</div>
