<div x-data="modelConfigData()" x-init="init()" class="p-4 space-y-6">

  <div x-show="errorMsg" class="flex items-center gap-3 p-3 rounded-lg bg-red-900/30 border border-red-700 text-red-300 text-sm">
    <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
    <span x-text="errorMsg"></span>
    <button @click="errorMsg=''" class="ml-auto text-red-400 hover:text-red-200">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <div x-show="successMsg" class="flex items-center gap-3 p-3 rounded-lg bg-emerald-900/30 border border-emerald-700 text-emerald-300 text-sm">
    <i data-lucide="check-circle" class="w-4 h-4 flex-shrink-0"></i>
    <span x-text="successMsg"></span>
    <button @click="successMsg=''" class="ml-auto text-emerald-400 hover:text-emerald-200">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <section>
    <div class="flex items-center justify-between mb-2">
      <div>
        <h2 class="text-lg font-semibold text-slate-100">全局预置模型</h2>
        <p x-show="isAdmin" class="text-xs text-slate-500 mt-1">拖动卡片可调整顺序，保存会自动生效。</p>
      </div>
      <button x-show="isAdmin" @click="openDialog('global', 'add')"
              class="flex items-center gap-1 px-3 py-1 text-sm rounded bg-indigo-600 hover:bg-indigo-500 text-white">
        <i data-lucide="plus" class="w-4 h-4"></i> 添加
      </button>
    </div>

    <div x-show="globalPresets.length === 0" class="text-slate-400 text-sm">暂无全局预置。</div>

    <div class="space-y-2" @dragover.prevent @drop.prevent="dropOnListEnd('global')">
      <template x-for="preset in globalPresets" :key="'global-' + preset.id">
        <div :draggable="isAdmin"
             @dragstart="startDrag('global', preset.id)"
             @dragend="endDrag()"
             @dragover.prevent.stop
             @drop.prevent.stop="dropOnItem('global', preset.id)"
             class="flex items-center justify-between gap-3 p-3 rounded-lg bg-slate-800 border border-slate-700 transition"
             :class="dragging && dragging.section === 'global' && dragging.id === preset.id ? 'opacity-50 ring-1 ring-indigo-400' : (isAdmin ? 'cursor-grab hover:border-slate-500' : '')">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <i x-show="isAdmin" data-lucide="grip-vertical" class="w-4 h-4 text-slate-500 flex-shrink-0"></i>
              <span class="font-medium text-slate-100 truncate" x-text="preset.displayName"></span>
            </div>
            <div class="mt-1 text-xs text-slate-400 break-all" x-text="preset.provider + ':' + preset.modelId"></div>
          </div>
          <div x-show="isAdmin" class="flex items-center gap-1 flex-shrink-0">
            <button @click="openDialog('global', 'edit', preset)" class="text-slate-300 hover:text-white p-1.5 rounded hover:bg-slate-700" title="编辑">
              <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button @click="deleteItem('global', preset.id)" class="text-red-400 hover:text-red-300 p-1.5 rounded hover:bg-slate-700" title="删除">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </template>
    </div>
  </section>

  <section>
    <div class="flex items-center justify-between mb-2">
      <div>
        <h2 class="text-lg font-semibold text-slate-100">我的自定义模型</h2>
        <p class="text-xs text-slate-500 mt-1">支持编辑和拖动排序，顺序会立即保存。</p>
      </div>
      <button @click="openDialog('user', 'add')"
              class="flex items-center gap-1 px-3 py-1 text-sm rounded bg-indigo-600 hover:bg-indigo-500 text-white">
        <i data-lucide="plus" class="w-4 h-4"></i> 添加
      </button>
    </div>

    <div x-show="userModels.length === 0" class="text-slate-400 text-sm">暂无自定义模型。</div>

    <div class="space-y-2" @dragover.prevent @drop.prevent="dropOnListEnd('user')">
      <template x-for="model in userModels" :key="'user-' + model.id">
        <div draggable="true"
             @dragstart="startDrag('user', model.id)"
             @dragend="endDrag()"
             @dragover.prevent.stop
             @drop.prevent.stop="dropOnItem('user', model.id)"
             class="flex items-center justify-between gap-3 p-3 rounded-lg bg-slate-800 border border-slate-700 transition cursor-grab hover:border-slate-500"
             :class="dragging && dragging.section === 'user' && dragging.id === model.id ? 'opacity-50 ring-1 ring-indigo-400' : ''">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-500 flex-shrink-0"></i>
              <span class="font-medium text-slate-100 truncate" x-text="model.displayName"></span>
            </div>
            <div class="mt-1 text-xs text-slate-400 break-all" x-text="model.provider + ':' + model.modelId"></div>
            <div x-show="model.baseUrl" class="mt-1 text-xs text-slate-500 break-all" x-text="model.baseUrl"></div>
          </div>
          <div class="flex items-center gap-1 flex-shrink-0">
            <button @click="openDialog('user', 'edit', model)" class="text-slate-300 hover:text-white p-1.5 rounded hover:bg-slate-700" title="编辑">
              <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button @click="deleteItem('user', model.id)" class="text-red-400 hover:text-red-300 p-1.5 rounded hover:bg-slate-700" title="删除">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </template>
    </div>
  </section>

  <div x-show="dialog.open" x-cloak class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
    <div @click.outside="closeDialog()" class="bg-slate-800 rounded-xl p-6 w-full max-w-md space-y-4 shadow-xl border border-slate-600">
      <h3 class="text-lg font-semibold text-slate-100"
          x-text="(dialog.mode === 'edit' ? '编辑' : '添加') + (dialog.target === 'global' ? '全局预置' : '自定义模型')"></h3>
      <div class="space-y-3">
        <div>
          <label class="text-sm text-slate-400 block mb-1">Provider</label>
          <select x-model="dialog.form.provider" class="w-full px-3 py-2 rounded bg-slate-700 text-slate-100 border border-slate-600">
            <option value="gemini">gemini</option>
            <option value="openrouter">openrouter</option>
            <option value="custom">custom</option>
          </select>
        </div>
        <div>
          <label class="text-sm text-slate-400 block mb-1">Model ID</label>
          <input x-model.trim="dialog.form.modelId" type="text" placeholder="e.g. meta-llama/llama-3.3-70b-instruct"
                 class="w-full px-3 py-2 rounded bg-slate-700 text-slate-100 border border-slate-600"/>
        </div>
        <div>
          <label class="text-sm text-slate-400 block mb-1">Display Name</label>
          <input x-model.trim="dialog.form.displayName" type="text" placeholder="e.g. Llama 3.3 70B"
                 class="w-full px-3 py-2 rounded bg-slate-700 text-slate-100 border border-slate-600"/>
        </div>
        <div x-show="dialog.target === 'user' && dialog.form.provider === 'custom'">
          <label class="text-sm text-slate-400 block mb-1">Base URL (custom only)</label>
          <input x-model.trim="dialog.form.baseUrl" type="text" placeholder="http://localhost:11434/v1"
                 class="w-full px-3 py-2 rounded bg-slate-700 text-slate-100 border border-slate-600"/>
        </div>
      </div>
      <div class="flex gap-2 justify-end">
        <button @click="closeDialog()" class="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600 text-slate-200">取消</button>
        <button @click="saveConfig()" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-white"
                x-text="dialog.mode === 'edit' ? '保存' : '添加'"></button>
      </div>
    </div>
  </div>

  <section>
    <h2 class="text-lg font-semibold text-slate-100 mb-2">API Key 管理</h2>
    <p class="text-xs text-slate-500 mb-3">Key 仅混淆存储在浏览器 Cookie 中，不上传至服务器存储。连接时通过 WebSocket 第一帧传输。</p>
    <div class="space-y-3">
      <template x-for="entry in keyEntries" :key="entry.id">
        <div class="p-3 rounded-lg bg-slate-800 border border-slate-700 space-y-2">
          <div class="flex items-center justify-between">
            <div>
              <span class="font-medium text-slate-100" x-text="entry.label"></span>
              <span class="ml-2 text-xs" :class="entry.saved ? 'text-green-400' : 'text-amber-400'"
                    x-text="entry.saved ? '✓ 已保存' : '⚠ 未配置'"></span>
            </div>
          </div>
          <div class="flex gap-2">
            <input :type="entry.show ? 'text' : 'password'" x-model="entry.draft"
                   :placeholder="entry.saved ? '（已保存，输入新值可覆盖）' : '输入 API Key...'"
                   class="flex-1 px-3 py-1.5 rounded bg-slate-700 text-slate-100 border border-slate-600 text-sm"/>
            <button @click="entry.show = !entry.show" class="px-2 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-slate-300">
              <i :data-lucide="entry.show ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
            </button>
            <button @click="saveKey(entry)" :disabled="!entry.draft"
                    class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-sm disabled:opacity-40">保存</button>
            <button x-show="entry.saved" @click="clearKey(entry)"
                    class="px-3 py-1.5 rounded bg-red-700 hover:bg-red-600 text-white text-sm">清除</button>
          </div>
        </div>
      </template>
    </div>
  </section>
</div>
