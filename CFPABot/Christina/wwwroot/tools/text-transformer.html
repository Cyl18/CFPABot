<div x-data="{ textInput: '' }">
    <div class="mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">Text Transformer</h2>
        <p class="text-slate-400">Manipulate text strings and copy results instantly.</p>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm">
        <label class="block text-sm font-medium text-slate-400 mb-2">Input Text</label>
        <textarea x-model="textInput"
            class="w-full h-32 bg-slate-950 border border-slate-700 rounded-lg p-4 text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all resize-none font-mono"
            placeholder="Type or paste your text here..."></textarea>
        <div class="flex gap-3 mt-4">
            <button @click="textInput = textInput.toUpperCase(); addToast('Converted to Uppercase', 'INFO', 2000)"
                class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-lg border border-slate-700 transition-all active:scale-95">Uppercase</button>
            <button @click="textInput = textInput.toLowerCase(); addToast('Converted to Lowercase', 'INFO', 2000)"
                class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-lg border border-slate-700 transition-all active:scale-95">Lowercase</button>
            <button @click="textInput = textInput.split('').reverse().join(''); addToast('Text Reversed', 'INFO', 2000)"
                class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-lg border border-slate-700 transition-all active:scale-95">Reverse</button>
            <div class="flex-1"></div>
            <button
                @click="if(!textInput) { addToast('Nothing to copy!', 'WARNING'); return; } navigator.clipboard.writeText(textInput); addToast('Copied to clipboard!', 'SUCCESS')"
                class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition-all shadow-lg shadow-indigo-500/20 active:scale-95 flex items-center gap-2">
                <i data-lucide="copy" class="w-4 h-4"></i> Copy Result
            </button>
        </div>
    </div>
</div>
