<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行内评论：英文/中文双锚点</title>
<style>
  :root{
    --bg:#17191c; --surface:#1e2124; --elevated:#26292d; --line:#33373c;
    --fg:#e7e9ec; --muted:#8d949d; --accent:#5aa2ff; --accent-soft:rgba(90,162,255,.14);
    --error:#ef5f6b; --error-soft:rgba(239,95,107,.14);
    --ok:#49c46f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .page{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:17px;margin:0 0 4px}
  .lede{margin:0 0 14px;color:var(--muted);font-size:13px}
  .lede kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--elevated)}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}
  .toggle{
    height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--line);
    background:var(--elevated);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;
  }
  .toggle[aria-pressed="true"]{border-color:rgba(90,162,255,.5);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .controls .hint{font-size:12px;color:var(--muted)}

  .panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
  .row-main{
    display:grid;grid-template-columns:230px minmax(0,1fr) minmax(0,1fr);
    align-items:start;padding:9px 14px;
  }
  .row-main.head{
    border-bottom:1px solid var(--line);padding-top:7px;padding-bottom:7px;
    color:var(--muted);font-size:12px;background:var(--elevated);
  }
  .row+.row .row-main{border-top:1px solid var(--line)}
  .row:hover .row-main{background:rgba(255,255,255,.02)}
  .key{display:flex;flex-direction:column;gap:5px;min-width:0;padding-right:12px}
  .key code{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .chip{width:max-content;font-size:11px;line-height:16px;padding:0 5px;border-radius:4px;border:1px solid var(--ok);color:var(--ok)}
  .ins{color:var(--ok)}

  .en-cell,.zh-cell{display:flex;align-items:flex-start;min-width:0}
  .en-cell .en,.zh-cell .zh{flex:1;min-width:0;overflow-wrap:anywhere}
  .align-right .en{text-align:right}
  .align-left .en{text-align:left}
  .head-en{text-align:right;padding-right:28px}
  .align-left .head-en{text-align:left;padding-left:28px;padding-right:0}
  .head-zh{padding-left:28px}

  .slot{flex:0 0 28px;width:28px;display:flex;justify-content:center;padding-top:1px}

  .anchor{
    min-width:20px;height:20px;border-radius:10px;border:1px solid transparent;background:none;
    color:var(--muted);font:inherit;font-size:11px;line-height:1;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0 3px;margin:0 2px;
    transition:opacity .12s,background .12s,color .12s;
  }
  .anchor svg{width:12px;height:12px;display:block}
  .anchor.empty{opacity:0;color:var(--muted)}
  .row:hover .anchor.empty{opacity:.55}
  .anchor.empty:hover,.anchor.empty:focus-visible{opacity:1;background:var(--elevated);color:var(--fg)}
  .anchor.has-open{background:var(--error-soft);border-color:rgba(239,95,107,.4);color:var(--error);font-weight:600}
  .anchor.done{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--muted)}
  .anchor.active{outline:2px solid var(--accent);outline-offset:2px}

  .thread-zone{
    border-left:3px solid var(--error);background:rgba(255,255,255,.025);
    padding:10px 16px 14px 14px;display:flex;flex-direction:column;gap:10px;
  }
  .thread-zone.quiet{border-left-color:var(--line)}
  .side-tabs{display:flex;gap:6px}
  .side-tab{
    height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--line);
    background:var(--elevated);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .side-tab[aria-selected="true"]{border-color:rgba(90,162,255,.5);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .side-tab .n{
    font-size:11px;min-width:14px;height:14px;border-radius:7px;padding:0 4px;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--error-soft);color:var(--error);font-weight:600;
  }
  .side{display:flex;flex-direction:column;gap:9px}
  .thread{display:flex;flex-direction:column;gap:8px}
  .thread-head{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--error)}
  .thread.done .thread-head{color:var(--muted);font-weight:500}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .bubble{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:8px 10px}
  .bubble.dim{opacity:.75}
  .who{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-bottom:3px}
  .avatar{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:600}
  .who b{color:var(--fg);font-weight:600}
  .body{font-size:13.5px;overflow-wrap:anywhere}
  .ghost{width:max-content;background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;padding:2px 0;text-align:left}
  .ghost:hover{color:var(--fg);text-decoration:underline}

  .reply-row{display:flex;gap:6px}
  .reply{
    flex:1;min-width:0;height:30px;border-radius:6px;border:1px solid var(--line);
    background:var(--bg);color:var(--fg);font:inherit;font-size:13px;padding:0 9px;
  }
  .reply:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .reply::placeholder{color:var(--muted)}

  .new-comment{border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:7px}
  .new-comment textarea{
    width:100%;min-height:50px;resize:vertical;border-radius:6px;border:1px dashed rgba(90,162,255,.55);
    background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px;padding:8px 10px;
  }
  .new-comment textarea:focus{outline:2px solid var(--accent-soft);border-style:solid;border-color:var(--accent)}
  .composer-bar{display:flex;align-items:center;gap:8px}
  .composer-bar .hint{margin-right:auto;font-size:12px;color:var(--muted)}
  .btn{height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--elevated);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn.primary{border-color:rgba(90,162,255,.55);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .btn:hover{filter:brightness(1.15)}

  .peek{
    position:fixed;z-index:60;width:340px;max-height:min(46vh,240px);overflow:hidden;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 14px 34px rgba(0,0,0,.5);padding:10px 12px;
    display:flex;flex-direction:column;gap:7px;pointer-events:none;
  }
  .peek[hidden]{display:none}
  .peek-head{font-size:12px;font-weight:600;color:var(--muted)}
  .peek-head.err{color:var(--error)}
  .peek-item{font-size:12.5px;color:var(--muted)}
  .peek-item b{color:var(--fg);font-weight:600;display:block}
  .peek-body{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--fg);font-size:13px}
  .peek-foot{border-top:1px solid var(--line);padding-top:6px;font-size:11.5px;color:var(--muted)}
  .footnote{margin-top:16px;color:var(--muted);font-size:12px}

  @media (max-width:820px){
    .row-main{grid-template-columns:minmax(0,1fr);gap:6px}
    .en-cell,.zh-cell{gap:6px}
    .align-right .en,.align-left .en{text-align:left}
    .head-en,.head-zh,.align-left .head-en{text-align:left;padding:0}
    .slot{flex-basis:20px;width:20px;order:-1}
  }
</style>
</head>
<body>
<div class="page">
  <h1>行内评论：英文 / 中文双锚点</h1>
  <p class="lede">
    加号在两列之间：<b>左半边评英文，右半边评中文</b>。有评论就变成对话气泡，未解决红色、已解决灰色。
    英文列右对齐时两个气泡并排；切左对齐，英文气泡跟着文字走到左边。<kbd>Esc</kbd> 收起。
  </p>
  <div class="controls">
    <button class="toggle" id="align-toggle" aria-pressed="true">英文右对齐</button>
    <span class="hint">点一下切左对齐，看英文锚点怎么跟着文字走</span>
  </div>

  <div class="panel" id="panel">
    <div class="row-main head align-right" id="head">
      <span>Key</span>
      <span class="head-en">英文 PR</span>
      <span class="head-zh">中文 PR</span>
    </div>
    <div id="rows"></div>
  </div>

  <p class="footnote">数据是假的，刷新即还原。气泡只数未解决对话；回复已解决的对话会重新打开它。</p>
</div>

<div class="peek" id="peek" hidden aria-hidden="true"></div>

<script>
const rows = [
  { key:'block.binniebees.alveary_frame', en:'Alveary Frame Housing', zh:'蜂房组框架槽', added:true },
  { key:'block.binniebees.alveary_hatchery', en:'Alveary Hatchery', zh:'蜂房组孵化场', added:true },
  { key:'block.binniebees.alveary_light', en:'Alveary Lighting', zh:'蜂房组补光器', added:true },
  { key:'item.binniebees.bee_species.basalt', en:'Basalt', zh:'玄武岩', added:true, threads:[
      { id:'t1', side:'en', resolved:false, comments:[
        { author:'Demonense', when:'2 天前', body:'英文原文这里首字母是不是该大写？其他条目都是大写。' },
      ]},
      { id:'t2', side:'zh', resolved:false, comments:[
        { author:'Demonense', when:'2 天前', body:'这里 Basalt 和 Basalt Block 分不开，建议保留原文。' },
        { author:'Cyl18', when:'1 天前', body:'同意，玄武岩块另开 key。' },
      ]},
      { id:'t3', side:'zh', resolved:true, comments:[
        { author:'Demonense', when:'3 天前', body:'行尾多了个空格，顺手删掉了。' },
      ]},
    ]},
  { key:'item.binniebees.bee_species.bauxite', en:'Bauxite', zh:'铝土', added:true },
  { key:'item.binniebees.bee_species.black', en:'Black', zh:'乌黑', added:true },
  { key:'item.binniebees.bee_species.coal', en:'Coal', zh:'煤炭', added:true, threads:[
      { id:'t4', side:'zh', resolved:true, comments:[
        { author:'Cyl18', when:'4 天前', body:'已统一成「煤炭」，原版就是这么写的。' },
      ]},
    ]},
  { key:'item.binniebees.bee_species.diamond', en:'Diamond', zh:'钻石', added:true },
];

const state = { open:null, side:null, enAlign:'right', resolved:new Set(), drafts:{}, focusNew:null };
const rowsEl = document.getElementById('rows');
const headEl = document.getElementById('head');
const peekEl = document.getElementById('peek');
const alignBtn = document.getElementById('align-toggle');

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const colorOf = (name) => name === 'Demonense' ? '#7a5cff' : name === 'Cyl18' ? '#3aa675' : '#5aa2ff';
const rowOf = (key) => rows.find((r) => r.key === key);
const threadsOf = (row, side) => (row.threads || []).filter((t) => t.side === side);
const openOf = (row, side) => threadsOf(row, side).filter((t) => !t.resolved);
const doneOf = (row, side) => threadsOf(row, side).filter((t) => t.resolved);

const ICON_BUBBLE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 3.2h11v6.6H8.2L5.4 12V9.8H2.5z"/></svg>';
const ICON_PLUS = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>';

function commentHtml(c, dim) {
  return `<div class="bubble${dim ? ' dim' : ''}">
    <div class="who">
      <span class="avatar" style="background:${colorOf(c.author)}">${esc(c.author[0])}</span>
      <b>${esc(c.author)}</b><span>${esc(c.when)}</span>
    </div>
    <div class="body">${esc(c.body)}</div>
  </div>`;
}

function threadHtml(row, t) {
  const done = t.resolved === true;
  const head = `<div class="thread-head"><span class="dot"></span>${done ? '已解决' : '未解决'} · ${esc(t.comments[0].author)}${t.comments.length > 1 ? ` · ${t.comments.length} 条` : ''}</div>`;
  const comments = t.comments.map((c) => commentHtml(c, done)).join('');
  const reply = `<div class="reply-row">
    <input class="reply" data-reply="${row.key}|${t.id}" placeholder="回复 ${esc(t.comments[0].author)}…${done ? '（会重新打开）' : ''}" aria-label="回复这条对话">
    <button class="btn" data-send-reply="${row.key}|${t.id}">回复</button>
  </div>`;
  return `<div class="thread${done ? ' done' : ''}">${head}${comments}${reply}</div>`;
}

function newCommentHtml(row, side) {
  const id = `${row.key}:${side}`;
  const label = side === 'en' ? '英文' : '中文';
  return `<div class="new-comment">
    <textarea rows="2" data-draft="${id}" placeholder="给${label}这一行新开一条评论…">${esc(state.drafts[id] || '')}</textarea>
    <div class="composer-bar">
      <span class="hint">⌘/Ctrl + Enter 发送 · 回复对话请用上面的输入框</span>
      <button class="btn primary" data-send-new="${id}">发送</button>
    </div>
  </div>`;
}

function sideHtml(row, side) {
  const open = openOf(row, side);
  const done = doneOf(row, side);
  const key = `${row.key}:${side}`;
  const expanded = state.resolved.has(key);
  let html = open.map((t) => threadHtml(row, t)).join('');
  if (done.length > 0) {
    html += expanded
      ? `${done.map((t) => threadHtml(row, t)).join('')}<button class="ghost" data-resolved="${key}">收起已解决</button>`
      : `<button class="ghost" data-resolved="${key}">已解决 ${done.length} 条 · 展开</button>`;
  }
  return `<section class="side">${html}${newCommentHtml(row, side)}</section>`;
}

function zoneHtml(row) {
  const tabs = ['en', 'zh'].map((side) => {
    const open = openOf(row, side).length;
    const label = side === 'en' ? '英文' : '中文';
    return `<button class="side-tab" role="tab" aria-selected="${state.side === side}" data-side-tab="${row.key}:${side}">${label}${open > 0 ? `<span class="n">${open}</span>` : ''}</button>`;
  }).join('');
  return `<div class="side-tabs" role="tablist" aria-label="评论语言">${tabs}</div>${sideHtml(row, state.side)}`;
}

function anchorHtml(row, side) {
  const open = openOf(row, side).length;
  const all = threadsOf(row, side).length;
  const label = side === 'en' ? '英文' : '中文';
  const cls = open > 0 ? 'has-open' : all > 0 ? 'done' : 'empty';
  const icon = all > 0 ? ICON_BUBBLE : ICON_PLUS;
  const text = open > 0 ? `<span>${open}</span>` : '';
  const title = open > 0 ? `${label}有 ${open} 条未解决对话` : all > 0 ? `${label}的对话都已解决` : `评论${label}这一行`;
  return `<span class="slot"><button class="anchor ${cls}${state.open === row.key && state.side === side ? ' active' : ''}"
    data-anchor="${row.key}:${side}" aria-label="${title}" title="${title}">${icon}${text}</button></span>`;
}

function rowHtml(row) {
  const open = state.open === row.key;
  const enAnchor = anchorHtml(row, 'en');
  const zhAnchor = anchorHtml(row, 'zh');
  return `<div class="row" data-key="${row.key}">
    <div class="row-main">
      <div class="key"><code>${row.key}</code>${row.added ? '<span class="chip">新增</span>' : ''}</div>
      <div class="en-cell">
        ${state.enAlign === 'left' ? enAnchor : ''}
        <div class="en${row.added ? ' ins' : ''}">${esc(row.en)}</div>
        ${state.enAlign === 'right' ? enAnchor : ''}
      </div>
      <div class="zh-cell">
        ${zhAnchor}
        <div class="zh${row.added ? ' ins' : ''}">${esc(row.zh)}</div>
      </div>
    </div>
    ${open ? `<div class="thread-zone${openOf(row, state.side).length > 0 ? '' : ' quiet'}">${zoneHtml(row)}</div>` : ''}
  </div>`;
}

function render() {
  hidePeek();
  document.getElementById('rows').className = `align-${state.enAlign}`;
  headEl.className = `row-main head align-${state.enAlign}`;
  rowsEl.innerHTML = rows.map(rowHtml).join('');
  rowsEl.querySelectorAll('[data-anchor]').forEach((el) => {
    const key = el.dataset.anchor;
    el.addEventListener('mouseenter', () => schedulePeek(key));
    el.addEventListener('mouseleave', hidePeek);
    el.addEventListener('focus', () => schedulePeek(key));
    el.addEventListener('blur', hidePeek);
  });
  if (state.focusNew !== null) {
    const target = rowsEl.querySelector(`[data-draft="${state.focusNew}"]`);
    state.focusNew = null;
    target?.focus();
  }
}

/* ---------- 悬停只读预览 ---------- */

let peekTimer = 0;
let peekSuppressUntil = 0;

function schedulePeek(id) {
  if (Date.now() < peekSuppressUntil) return;
  if (state.open === id.split(':')[0] && state.side === id.split(':')[1]) return;
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => showPeek(id), 180);
}

function showPeek(id) {
  const [rowKey, side] = id.split(':');
  const row = rowOf(rowKey);
  if (row === undefined) return;
  const open = openOf(row, side);
  const done = doneOf(row, side);
  if (open.length === 0 && done.length === 0) return;
  const first = open[0] ?? done[0];
  const isOpen = open.length > 0;
  const label = side === 'en' ? '英文' : '中文';
  let html = `<div class="peek-head${isOpen ? ' err' : ''}">${label} · ${isOpen ? '未解决' : '已解决'} · ${esc(first.comments[0].author)}${first.comments.length > 1 ? ` · ${first.comments.length} 条` : ''}</div>`;
  html += first.comments.slice(0, 2).map((c) => `<div class="peek-item"><b>${esc(c.author)}</b><span class="peek-body">${esc(c.body)}</span></div>`).join('');
  const more = [];
  if (open.length > 1) more.push(`${open.length - 1} 条未解决`);
  if (done.length > 0) more.push(`${done.length} 条已解决`);
  if (more.length > 0) html += `<div class="peek-item">另有 ${more.join('、')}</div>`;
  html += `<div class="peek-foot">点击展开 · 回复或新开一条</div>`;
  peekEl.innerHTML = html;
  peekEl.hidden = false;
  positionPeek();
}

function positionPeek() {
  if (peekEl.hidden) return;
  const anchor = rowsEl.querySelector('.anchor:hover');
  if (anchor === null) return;
  const rect = anchor.getBoundingClientRect();
  const w = peekEl.offsetWidth;
  const h = peekEl.offsetHeight;
  let left = rect.right + 10;
  let top = rect.top - 4;
  if (left + w > window.innerWidth - 12) left = Math.max(12, rect.left - w - 10);
  if (top + h > window.innerHeight - 12) top = Math.max(12, window.innerHeight - h - 12);
  peekEl.style.left = `${left}px`;
  peekEl.style.top = `${top}px`;
}

function hidePeek() {
  clearTimeout(peekTimer);
  peekEl.hidden = true;
  peekEl.innerHTML = '';
}

/* ---------- 两个动作 ---------- */

function sendReply(rowKey, threadId) {
  const row = rowOf(rowKey);
  const thread = (row?.threads || []).find((t) => t.id === threadId);
  const input = rowsEl.querySelector(`[data-reply="${rowKey}|${threadId}"]`);
  const body = (input?.value || '').trim();
  if (thread === undefined || body === '') return;
  thread.comments.push({ author:'你', when:'刚刚', body });
  thread.resolved = false;
  render();
  rowsEl.querySelector(`[data-reply="${rowKey}|${threadId}"]`)?.focus();
}

function sendNew(id) {
  const [rowKey, side] = id.split(':');
  const row = rowOf(rowKey);
  const body = (state.drafts[id] || '').trim();
  if (row === undefined || body === '') return;
  row.threads = row.threads || [];
  row.threads.unshift({ id:`t${Date.now()}`, side, resolved:false, comments:[{ author:'你', when:'刚刚', body }] });
  state.drafts[id] = '';
  state.focusNew = id;
  render();
}

function close() {
  const key = state.open;
  state.open = null;
  state.side = null;
  peekSuppressUntil = Date.now() + 500;
  render();
  if (key !== null) rowsEl.querySelector(`[data-anchor="${key}:en"]`)?.focus();
}

/* ---------- 事件 ---------- */

document.addEventListener('click', (event) => {
  const anchor = event.target.closest('[data-anchor]');
  if (anchor !== null) {
    const [rowKey, side] = anchor.dataset.anchor.split(':');
    if (state.open === rowKey && state.side === side) close();
    else {
      state.open = rowKey;
      state.side = side;
      state.focusNew = `${rowKey}:${side}`;
      render();
    }
    return;
  }
  const replyBtn = event.target.closest('[data-send-reply]');
  if (replyBtn !== null) {
    const [rowKey, threadId] = replyBtn.dataset.sendReply.split('|');
    return sendReply(rowKey, threadId);
  }
  const newBtn = event.target.closest('[data-send-new]');
  if (newBtn !== null) return sendNew(newBtn.dataset.sendNew);
  const resolved = event.target.closest('[data-resolved]');
  if (resolved !== null) {
    const key = resolved.dataset.resolved;
    if (state.resolved.has(key)) state.resolved.delete(key);
    else state.resolved.add(key);
    render();
    return;
  }
  const sideTab = event.target.closest('[data-side-tab]');
  if (sideTab !== null) {
    const [rowKey, side] = sideTab.dataset.sideTab.split(':');
    state.open = rowKey;
    state.side = side;
    render();
  }
});

document.addEventListener('input', (event) => {
  const box = event.target.closest('[data-draft]');
  if (box !== null) state.drafts[box.dataset.draft] = box.value;
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') {
    if (state.open !== null) {
      event.preventDefault();
      close();
    } else {
      hidePeek();
    }
    return;
  }
  const reply = event.target.closest('[data-reply]');
  if (reply !== null && event.key === 'Enter') {
    event.preventDefault();
    const [rowKey, threadId] = reply.dataset.reply.split('|');
    sendReply(rowKey, threadId);
    return;
  }
  if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
    const draft = event.target.closest('[data-draft]');
    if (draft !== null) {
      event.preventDefault();
      sendNew(draft.dataset.draft);
    }
  }
});

alignBtn.addEventListener('click', () => {
  state.enAlign = state.enAlign === 'right' ? 'left' : 'right';
  alignBtn.setAttribute('aria-pressed', String(state.enAlign === 'right'));
  alignBtn.textContent = state.enAlign === 'right' ? '英文右对齐' : '英文左对齐';
  render();
});

window.addEventListener('scroll', positionPeek, { passive:true });
window.addEventListener('resize', positionPeek);

render();
</script>
</body>
</html>
